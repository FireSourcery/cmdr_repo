name: cmdr
description: "Commander/Host side utilities for interfacing with embedded devices + other general utilities."
version: 0.0.1
# homepage:

publish_to: "none"

environment:
  sdk: ^3.13.0
  flutter: ^3.32.0  

resolution: workspace

dependencies: 
  struct_data: ^0.1.3

  flutter:
    sdk: flutter
  async: ^2.11.0
  meta: ^1.11.0
  collection: ^1.18.0

  csv: ^8.0.0
  file_picker: ^13.3.2
  fl_chart: ^1.1.1
  flutter_libserialport: ^0.6.0 # no Dart import: builds and deploys the C library that libserialport loads
  intel_hex: ^1.2.1
  libserialport: ^0.3.0+1
  recase: ^4.1.0
  shared_preferences: ^2.2.3
  synchronized: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 
  lints: ^6.1.0
  test: ^1.25.5
